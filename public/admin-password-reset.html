<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Mantra — Admin Password Setup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-shadow:0 20px 60px #000}.logo{text-align:center;font-size:30px;color:#f2bd18}.brand{text-align:center;font-size:24px;font-weight:900}.sub{text-align:center;color:#999;font-size:13px;margin:8px 0 20px}.field{margin:12px 0}.field label{display:block;color:#ddd;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border-radius:10px;border:1px solid #363636;background:#080808;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#f2bd18;color:#111;font-weight:900;margin-top:8px}.msg{display:none;padding:11px;border-radius:10px;margin:12px 0;font-size:13px}.msg.show{display:block}.err{background:#3a1111;color:#ffbaba;border:1px solid #692222}.ok{background:#10321f;color:#baf5cf;border:1px solid #236b40}.small{text-align:center;color:#777;font-size:12px;margin-top:14px}a{color:#f2bd18;text-decoration:none}</style></head><body><div class="card"><div class="logo">☀</div><div class="brand">Admin Password Setup</div><div class="sub">यह केवल Supabase Auth के Admin account का password सेट/बदलने के लिए है। Password database में plain text में नहीं रखा जाता।</div><div id="msg" class="msg"></div><form id="f"><div class="field"><label>नया Admin Password</label><input id="p1" type="password" minlength="6" autocomplete="new-password" required placeholder="कम से कम 6 characters"></div><div class="field"><label>पासवर्ड दोबारा लिखें</label><input id="p2" type="password" minlength="6" autocomplete="new-password" required placeholder="Password confirm करें"></div><button class="btn" id="save">Password Save करें</button></form><div class="small"><a href="/admin-login.html">← Admin Login</a></div></div><script>const $=s=>document.querySelector(s);function msg(t,c='err'){const e=$('#msg');e.textContent=t;e.className='msg show '+c}async function go(){const s=await window.SM_SUPABASE.init();if(!s)throw Error('Supabase configure नहीं है।');const {data,error}=await s.auth.getSession();if(error)throw error;if(!data.session)throw Error('Password setup link से यह page खोलें।');return s}window.addEventListener('load',async()=>{try{await go()}catch(e){msg(e.message||'Session नहीं मिली।')}});$('#f').onsubmit=async e=>{e.preventDefault();if($('#p1').value!==$('#p2').value)return msg('दोनों password एक जैसे होने चाहिए।');try{const s=await go();const {data,error}=await s.auth.updateUser({password:$('#p1').value});if(error)throw error;msg('Admin password सफलतापूर्वक set हो गया। अब Admin Login करें।','ok');setTimeout(()=>location.href='/admin-login.html',900)}catch(e){msg(e.message||'Password update failed')}};</script></body></html>

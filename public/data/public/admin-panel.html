<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808">
<title>Study Mantra — Admin Panel</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#101010;border-right:1px solid #292929;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:21px}.gold{color:#f2bd18}.muted{color:#9b9b9b;font-size:13px}.nav{margin-top:22px}.nav button{width:100%;text-align:left;background:transparent;color:#ddd;border:0;padding:12px;border-radius:10px;margin:3px 0;cursor:pointer;font-weight:700}.nav button.active,.nav button:hover{background:#242424;color:#fff}.logout{margin-top:20px;width:100%;padding:11px;border:0;border-radius:10px;background:#3b1414;color:#ffb5b5;font-weight:800}.main{padding:20px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top h1{margin:0}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#222;font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.card{background:#111;border:1px solid #292929;border-radius:15px;padding:16px}.stat{font-size:27px;font-weight:900;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.tablewrap{overflow:auto;border:1px solid #292929;border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:10px;border-bottom:1px solid #242424;text-align:left;font-size:13px;vertical-align:top}.table th{color:#aaa;background:#151515;position:sticky;top:0}.btn{border:0;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:700;margin:2px}.primary{background:#f2bd18;color:#111}.dark{background:#242424;color:#fff}.danger{background:#4a1515;color:#ffc0c0}.ok{background:#123d26;color:#b7f7c8}.input{width:100%;padding:10px;border:1px solid #333;background:#0c0c0c;color:#fff;border-radius:9px}.search{display:flex;gap:8px;margin:12px 0}.notice{padding:13px;border-radius:11px;background:#171717;border:1px solid #2b2b2b;color:#ccc}.hidden{display:none!important}.stars{letter-spacing:1px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modalbox{width:min(720px,100%);max-height:85vh;overflow:auto;background:#111;border:1px solid #333;border-radius:16px;padding:18px}.msg{padding:8px 10px;border-radius:9px;background:#191919;margin:5px 0}.msg.mine{background:#2a2110}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:#888}
@media(max-width:760px){.app{display:block}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid #292929}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.main{padding:13px}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:13px}.top h1{font-size:23px}}
</style></head><body>
<div class="app"><aside><div class="brand">☀ Study <span class="gold">Mantra</span></div><div id="identity" class="muted" style="margin-top:6px">Checking admin…</div><div class="nav" id="nav"></div><button class="logout" id="logout">Logout</button></aside>
<main class="main"><div class="top"><h1 id="title">Admin Overview</h1><span class="pill">ADMIN CONTROL CENTER</span></div><div id="content"></div></main></div><div id="modal" class="hidden"></div>
<script>
const $=s=>document.querySelector(s);let me=null,stats=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function api(url,opts={}){opts.headers={...(opts.headers||{}),...(localStorage.getItem('studyMantraToken')?{Authorization:'Bearer '+localStorage.getItem('studyMantraToken')}:{})};if(opts.body&&typeof opts.body!=='string')opts.body=JSON.stringify(opts.body);const r=await fetch(url,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function nav(){const items=[['overview','Overview'],['users','Users'],['applications','Astrologer Approval'],['astrologers','Astrologers'],['chats','Chat Monitor'],['reviews','Reviews'],['audit','Audit Log']];$('#nav').innerHTML=items.map(([id,n])=>`<button data-p="${id}">${n}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.p))}
function title(t){$('#title').textContent=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===current))}let current='overview';
async function show(p){current=p;title(({overview:'Admin Overview',users:'Users',applications:'Astrologer Approval',astrologers:'Astrologers',chats:'Chat Monitor',reviews:'Review Moderation',audit:'Audit Log'})[p]);try{if(p==='overview')await overview();if(p==='users')await users();if(p==='applications')await applications();if(p==='astrologers')await astrologers();if(p==='chats')await chats();if(p==='reviews')await reviews();if(p==='audit')await audit()}catch(e){$('#content').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function statCard(n,v){return `<div class="card"><div class="muted">${n}</div><div class="stat">${v}</div></div>`}
async function overview(){const j=await api('/api/admin?action=overview');stats=j.stats;$('#content').innerHTML=`<div class="cards">${Object.entries({Users:stats.users,Astrologers:stats.astrologers,'Pending Approval':stats.pendingApplications,'Approved Astrologers':stats.approvedAstrologers,'Online Astrologers':stats.onlineAstrologers,'Active Chats':stats.activeChats,'Total Chats':stats.totalChats,Reviews:stats.totalReviews,'Pending Reviews':stats.pendingReviews,Kundlis:stats.totalKundalis}).map(([k,v])=>statCard(k,v)).join('')}</div><div class="grid"><div class="card"><div class="sectionTitle"><h3>Quick Actions</h3></div><button class="btn primary" onclick="show('applications')">Review Applications</button><button class="btn dark" onclick="show('users')">Manage Users</button><button class="btn dark" onclick="show('astrologers')">Manage Astrologers</button><button class="btn dark" onclick="show('reviews')">Moderate Reviews</button></div><div class="card"><h3>Admin Security</h3><p class="muted">यह panel server-side role check के बाद ही data access करता है। Admin actions audit log में record होते हैं। Service-role key browser में expose नहीं होती।</p></div></div>`}
async function users(){const q=prompt('User search (name/email/phone), खाली छोड़ें तो सभी users:')??'';const j=await api('/api/admin?action=users&q='+encodeURIComponent(q));$('#content').innerHTML=`<div class="search"><input class="input" value="${esc(q)}" id="uq" placeholder="Name, email या phone"><button class="btn primary" onclick="loadUsers()">Search</button></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>Phone</th><th>Role</th><th>Created</th><th>Action</th></tr></thead><tbody>${j.users.map(u=>`<tr><td><b>${esc(u.full_name||'—')}</b><div class="small">${esc(u.email||'')}</div><div class="small">${esc(u.id)}</div></td><td>${esc(u.phone||'—')}</td><td><select class="input" style="width:auto" onchange="changeRole('${u.id}',this.value)"><option ${u.role==='user'?'selected':''}>user</option><option ${u.role==='astrologer'?'selected':''}>astrologer</option><option ${u.role==='admin'?'selected':''}>admin</option></select></td><td>${new Date(u.created_at).toLocaleString()}</td><td><button class="btn dark" onclick="editUser('${u.id}','${esc(u.full_name||'')}','${esc(u.phone||'')}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
async function loadUsers(){const q=$('#uq').value;const j=await api('/api/admin?action=users&q='+encodeURIComponent(q));const old=$('#content');old.innerHTML='';await usersRender(j.users)}
async function usersRender(rows){$('#content').innerHTML=`<div class="search"><input class="input" value="" id="uq" placeholder="Name, email या phone"><button class="btn primary" onclick="loadUsers()">Search</button></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>Phone</th><th>Role</th><th>Created</th><th>Action</th></tr></thead><tbody>${rows.map(u=>`<tr><td><b>${esc(u.full_name||'—')}</b><div class="small">${esc(u.email||'')}</div></td><td>${esc(u.phone||'—')}</td><td><select class="input" style="width:auto" onchange="changeRole('${u.id}',this.value)"><option ${u.role==='user'?'selected':''}>user</option><option ${u.role==='astrologer'?'selected':''}>astrologer</option><option ${u.role==='admin'?'selected':''}>admin</option></select></td><td>${new Date(u.created_at).toLocaleString()}</td><td><button class="btn dark" onclick="editUser('${u.id}','${esc(u.full_name||'')}','${esc(u.phone||'')}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
async function changeRole(id,role){if(!confirm('Role को '+role+' करना है?'))return;await api('/api/admin?action=user',{method:'PATCH',body:{user_id:id,role}});alert('Role updated');}
async function editUser(id,name,phone){const n=prompt('Full name:',name)||name;const p=prompt('Phone:',phone)||phone;await api('/api/admin?action=user',{method:'PATCH',body:{user_id:id,full_name:n,phone:p}});alert('User updated');show('users')}
async function applications(){const j=await api('/api/admin?action=applications');$('#content').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Applicant</th><th>Experience</th><th>Expertise</th><th>Fee</th><th>Status</th><th>Action</th></tr></thead><tbody>${j.applications.map(a=>`<tr><td><b>${esc(a.profile?.full_name||'—')}</b><div class="small">${esc(a.profile?.email||'')} · ${esc(a.profile?.phone||'')}</div></td><td>${a.experience_years||0} yrs</td><td>${esc((a.expertise||[]).join(', '))}</td><td>₹${Number(a.requested_fee||0)}</td><td><span class="pill">${esc(a.status)}</span></td><td>${a.status==='pending'?`<button class="btn ok" onclick="approveApp('${a.user_id}')">Approve</button><button class="btn danger" onclick="rejectApp('${a.user_id}')">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
async function approveApp(id){if(!confirm('Is astrologer ko approve karna hai?'))return;try{const j=await api('/api/admin?action=application',{method:'PATCH',body:{user_id:id,status:'approved'}});alert(j.message||'Astrologer approved');await show('applications');}catch(e){alert('Approval failed: '+e.message)}}
async function rejectApp(id){const note=prompt('Rejection note:','Application rejected by admin')||'';try{const j=await api('/api/admin?action=application',{method:'PATCH',body:{user_id:id,status:'rejected',admin_note:note}});alert(j.message||'Application rejected');await show('applications');}catch(e){alert('Rejection failed: '+e.message)}}
async function astrologers(){const j=await api('/api/admin?action=astrologers');$('#content').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Astrologer</th><th>Verified</th><th>Online</th><th>Fee</th><th>Discount</th><th>Action</th></tr></thead><tbody>${j.astrologers.map(a=>`<tr><td><b>${esc(a.profile?.full_name||'—')}</b><div class="small">${esc(a.profile?.email||'')}</div></td><td>${a.verified?'✅':'❌'}</td><td>${a.online?'🟢':'⚪'}</td><td><input class="input" style="width:100px" id="fee-${a.id}" value="${Number(a.fee||0)}"></td><td><input class="input" style="width:80px" id="disc-${a.id}" value="${Number(a.discount||0)}"></td><td><button class="btn primary" onclick="saveAstro('${a.id}')">Save</button><button class="btn ${a.verified?'danger':'ok'}" onclick="verifyAstro('${a.id}',${!a.verified})">${a.verified?'Unverify':'Verify'}</button><button class="btn dark" onclick="toggleOnline('${a.id}',${!a.online})">${a.online?'Offline':'Online'}</button></td></tr>`).join('')}</tbody></table></div>`}
async function saveAstro(id){await api('/api/admin?action=astrologer',{method:'PATCH',body:{astrologer_id:id,fee:Number($('#fee-'+id).value),discount:Number($('#disc-'+id).value)}});alert('Saved')}
async function verifyAstro(id,v){await api('/api/admin?action=astrologer',{method:'PATCH',body:{astrologer_id:id,verified:v}});show('astrologers')}
async function toggleOnline(id,v){await api('/api/admin?action=astrologer',{method:'PATCH',body:{astrologer_id:id,online:v}});show('astrologers')}
async function chats(){const j=await api('/api/admin?action=conversations');$('#content').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>Astrologer</th><th>Status</th><th>Created</th><th>Monitor</th></tr></thead><tbody>${j.conversations.map(c=>`<tr><td>${esc(c.user?.full_name||c.user_id)}</td><td>${esc(c.astrologer?.full_name||c.astrologer_id)}</td><td><span class="pill">${esc(c.status)}</span></td><td>${new Date(c.created_at).toLocaleString()}</td><td><button class="btn dark" onclick="viewMessages('${c.id}')">Messages</button> <button class="btn danger" onclick="closeChat('${c.id}')">Close</button></td></tr>`).join('')}</tbody></table></div>`}
async function viewMessages(id){const j=await api('/api/admin?action=messages&conversation_id='+encodeURIComponent(id));openModal('<h3>Chat Messages</h3>'+j.messages.map(m=>`<div class="msg ${m.sender_id===me.id?'mine':''}"><b>${esc(m.sender?.full_name||m.sender_id)}</b><div>${esc(m.body)}</div><div class="small">${new Date(m.created_at).toLocaleString()}</div></div>`).join('')+'<button class="btn dark" onclick="closeModal()">Close</button>')}
async function closeChat(id){if(!confirm('Chat close करना है?'))return;await api('/api/admin?action=conversation',{method:'PATCH',body:{conversation_id:id,status:'closed'}});show('chats')}
async function reviews(){const j=await api('/api/admin?action=reviews');$('#content').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Review</th><th>Rating</th><th>Status</th><th>Date</th><th>Moderation</th></tr></thead><tbody>${j.reviews.map(r=>`<tr><td><b>${esc(r.user?.full_name||'User')}</b> → ${esc(r.astrologer?.full_name||'Astrologer')}<div>${esc(r.review||'')}</div><div class="small">${esc(r.id)}</div></td><td><span class="stars">${'★'.repeat(Number(r.rating||0))}</span></td><td>${esc(r.moderation_status||'approved')}</td><td>${new Date(r.created_at).toLocaleString()}</td><td><button class="btn ok" onclick="moderate('${r.id}','approved')">Approve</button><button class="btn danger" onclick="moderate('${r.id}','hidden')">Hide</button><button class="btn dark" onclick="moderate('${r.id}','flagged')">Flag</button></td></tr>`).join('')}</tbody></table></div>`}
async function moderate(id,status){await api('/api/admin?action=review',{method:'PATCH',body:{review_id:id,moderation_status:status}});show('reviews')}
async function audit(){const j=await api('/api/admin?action=audit');$('#content').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody>${j.logs.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.admin?.full_name||x.admin?.email||x.admin_id)}</td><td>${esc(x.action)}</td><td><code>${esc(JSON.stringify(x.details))}</code></td></tr>`).join('')}</tbody></table></div>`}
function openModal(html){$('#modal').className='modal';$('#modal').innerHTML=`<div class="modalbox">${html}</div>`}function closeModal(){$('#modal').className='hidden';$('#modal').innerHTML=''}
$('#logout').onclick=async()=>{try{const sb=window.SM_SUPABASE?await window.SM_SUPABASE.init():null;if(sb)await sb.auth.signOut()}catch(e){}localStorage.removeItem('studyMantraToken');location.href='/admin-login.html'};
(async()=>{try{const j=await api('/api/me');if(!j.user||j.user.role!=='admin'){location.href='/admin-login.html';return}me=j.user;$('#identity').textContent=(j.user.full_name||j.user.email||'Admin')+' • Admin';nav();show('overview')}catch(e){$('#identity').textContent='Access denied';$('#content').innerHTML=`<div class="notice">${esc(e.message)}<br><br><a href="/admin-login.html" style="color:#f2bd18">Admin Login करें</a></div>`}})();
</script></body></html>

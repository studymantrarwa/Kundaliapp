<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Study Mantra — Astrologer Panel</title>
<link rel="stylesheet" href="/style.css">
<style>
body{margin:0;background:#050505;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.wrap{width:min(620px,100%);background:#111;border:1px solid #292929;border-radius:20px;padding:24px;box-sizing:border-box;box-shadow:0 12px 40px #000}.brand{font-size:22px;font-weight:800;margin-bottom:8px}.gold{color:#ffc400}.muted{color:#aaa;font-size:14px;line-height:1.6}.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;text-decoration:none;cursor:pointer;font-weight:700;margin:6px 6px 0 0}.primary{background:#ffc400;color:#111}.dark{background:#242424;color:#fff}.status{margin:18px 0;padding:14px;border-radius:12px;background:#171717;border:1px solid #292929}.error{color:#ffb4b4}.ok{color:#b7f7c8}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">☀ Study Mantra <span class="gold">Astrologer Panel</span></div>
  <div class="muted">यह सुरक्षित Astrologer Panel entry page है। Approved astrologer account से login करने के बाद आपका पूरा dashboard खुलेगा।</div>
  <div id="status" class="status">Account check हो रहा है…</div>
  <div>
    <a class="btn primary" href="/auth.html">Login / Sign Up</a>
    <a class="btn dark" href="/">Home</a>
  </div>
</div>
<script>
(async()=>{
 const box=document.getElementById('status');
 const token=localStorage.getItem('studyMantraToken');
 if(!token){box.innerHTML='<span class="error">पहले Login करें।</span>';return;}
 try{
   const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.user) throw new Error(j.error||'Login required');
   if(j.user.role!=='astrologer'){
     box.innerHTML='<span class="error">यह panel केवल approved Astrologer account के लिए है। आपका current role: '+String(j.user.role||'user')+'</span>';
     return;
   }
   box.innerHTML='<span class="ok">✓ Astrologer account verified. Dashboard खोला जा रहा है…</span>';
   setTimeout(()=>location.href='/dashboard.html?panel=astrologer',250);
 }catch(e){box.innerHTML='<span class="error">'+String(e.message||'Login required')+'</span>';}
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc107"><title>Study Mantra — Astrologer Panel</title>
<style>
:root{--yellow:#ffc107;--bg:#191a1c;--card:#292a2e;--line:#4b4c50;--text:#f5f5f5;--muted:#bdbdc2;--green:#45c95a;--blue:#1684ff;--red:#ff3f45;--purple:#6b5bd0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:82px}.top{height:92px;background:var(--yellow);color:#111;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-size:27px;font-weight:850}.topicons{display:flex;gap:22px;font-size:29px}.screen{display:none}.screen.active{display:block}.hero{padding:25px 20px 14px;display:flex;justify-content:space-between;gap:14px}.hero h1{font-size:27px;margin:8px 0}.hero p{margin:7px 0;color:#c6c6ca;font-size:17px}.avatar{width:116px;height:116px;border-radius:50%;background:#eee;object-fit:cover;border:5px solid #fff}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 18px 18px}.stat{background:var(--card);border-radius:11px;padding:17px 8px;text-align:center;min-height:110px}.stat .icon{font-size:28px}.stat b{display:block;font-size:25px;margin-top:4px}.stat span{color:#ddd;font-size:16px}.card{background:var(--card);border-radius:20px;margin:0 18px 18px;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px solid var(--line)}.row:last-child{border-bottom:0}.rowleft{display:flex;align-items:center;gap:16px;font-size:21px;font-weight:650}.ico{width:58px;height:58px;border-radius:10px;display:grid;place-items:center;font-size:29px;flex:0 0 auto}.blue{background:var(--blue)}.green{background:var(--green)}.pink{background:#ca54c4}.orange{background:#ff7200}.red{background:var(--red)}.purple{background:var(--purple)}.yellow{background:var(--yellow);color:#111}.switch{width:116px;height:54px;border:3px solid var(--yellow);border-radius:30px;background:transparent;position:relative;padding:0}.switch i{position:absolute;width:40px;height:40px;border-radius:50%;background:var(--yellow);left:5px;top:4px;transition:.2s}.switch.on{background:var(--yellow)}.switch.on i{background:#292a2e;left:66px}.linkrow{font-size:20px}.arrow{font-size:38px;font-weight:200;color:white}.sectionTitle{font-size:22px;font-weight:800;margin:25px 14px 12px}.back{display:flex;align-items:center;gap:12px;font-size:26px}.subhead{background:#171819;padding:10px 14px;color:var(--yellow);font-size:25px;font-weight:750}.earnCard{padding:12px 18px}.moneyRow{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-bottom:2px solid var(--line)}.moneyRow:last-child{border:0}.moneyRow .label{font-size:22px}.moneyRow small{display:block;color:#ccc;font-size:17px;margin-top:3px}.pill{min-width:190px;text-align:center;padding:14px 10px;border-radius:10px;font-size:22px;font-weight:800}.pblue{background:#1684ff}.pgreen{background:#45c95a}.ppurple{background:#6256c9}.ppink{background:#cf60c9}.pyellow{background:#ffbd00;color:#111}.perfTable{width:100%;border-collapse:collapse}.perfTable th{background:#ffe9dc;color:#111;text-align:left;padding:12px;font-size:16px}.perfTable td{padding:13px 10px;border-bottom:1px solid #505156;font-size:16px}.score{padding:7px 12px;border-radius:6px;display:inline-block;min-width:56px;text-align:center}.excellent{background:#b9e9c6;color:#174b26}.average{background:#ffe4ad;color:#634000}.poor{background:#ffaaa7;color:#641b18}.influence{color:#23a69a}.info{font-size:20px}.moreSection{padding:0 13px}.group{background:var(--card);border-radius:13px;overflow:hidden;margin-bottom:24px}.group h3{margin:0;padding:12px 0;color:#fff;font-size:19px}.group .row{padding:13px 12px}.group .rowleft{font-size:18px}.group .ico{width:40px;height:40px;font-size:21px}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#292a2e;border-top:1px solid #555;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.navbtn{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}.navbtn .nicon{font-size:25px}.navbtn.active{font-weight:800}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{background:#26272b;width:100%;border-radius:24px 24px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;color:#ddd;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border-radius:10px;border:1px solid #555;background:#171819;color:#fff}.actions{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:750}.primary{background:var(--yellow);color:#111}.secondary{background:#45464b;color:#fff}.danger{background:var(--red);color:#fff}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111;border:1px solid #666;padding:12px 16px;border-radius:12px;display:none;z-index:70}.toast.show{display:block}.loading{padding:35px;text-align:center;color:#ccc}@media(min-width:800px){.app{max-width:720px;margin:auto}.top{border-radius:0}.bottom{max-width:720px;left:50%;transform:translateX(-50%);border-radius:18px 18px 0 0}.modal{align-items:center}.sheet{max-width:600px;border-radius:20px}}
</style></head>
<body>
<div class="app">
<header class="top"><div class="brand">Study Mantra <span style="font-weight:600">Astrologer Panel</span></div><div class="topicons"><span onclick="help()">?</span><span onclick="notifyMe()">♟</span></div></header>
<main id="home" class="screen active"><div id="homeContent" class="loading">Loading astrologer profile…</div></main>
<main id="earnings" class="screen"><div class="hero"><div class="back" onclick="showTab('home')">‹ <b>Estimated Earnings</b></div></div><div id="earnContent" class="loading">Loading earnings…</div></main>
<main id="performance" class="screen"><div class="hero"><div class="back" onclick="showTab('home')">‹ <b>My Performance</b></div></div><div id="perfContent" class="loading">Loading performance…</div></main>
<main id="more" class="screen"><div class="hero"><div class="back" onclick="showTab('home')">‹ <b>Support</b></div></div><div id="moreContent"></div></main>
<nav class="bottom"><button class="navbtn active" data-tab="home" onclick="showTab('home')"><span class="nicon">⌂</span>Home</button><button class="navbtn" data-tab="earnings" onclick="showTab('earnings')"><span class="nicon">$</span>Earnings</button><button class="navbtn" data-tab="performance" onclick="showTab('performance')"><span class="nicon">▥</span>Performance</button><button class="navbtn" data-tab="more" onclick="showTab('more')"><span class="nicon">•••</span>More</button></nav>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);const token=localStorage.getItem('studyMantraToken');let state={};
function esc(x){return String(x??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2})}
async function api(route,opt={}){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch('/api/index?route='+encodeURIComponent(route),{...opt,signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Request failed ('+r.status+')'));return j}catch(e){if(e.name==='AbortError')throw new Error('Server response में समय लग रहा है। Vercel/Supabase connection check करें।');throw e}finally{clearTimeout(tm)}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function modal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')};function closeModal(){$('#modal').classList.remove('show')};$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function showTab(tab){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+tab).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='earnings')loadEarnings();if(tab==='performance')loadPerformance();if(tab==='more')renderMore()}
async function load(){
  if(!token){location.href='/astrologer-login.html';return}
  $('#homeContent').innerHTML='<div class="card"><h2>Astrologer account checking…</h2><p>Please wait while your role and panel access are verified.</p></div>';
  try{
    const me=await api('me');
    if(me.user?.role==='admin'){location.href='/admin-panel.html';return}
    if(me.user?.role!=='astrologer')throw new Error('यह account Astrologer role में नहीं है। Supabase profiles में role = astrologer होना चाहिए।');
    state=await api('astrologer-panel');
    renderHome();
  }catch(e){
    $('#homeContent').innerHTML='<div class="card"><h2>Astrologer Panel खुल नहीं पाया</h2><p>'+esc(e.message)+'</p><p style="color:#ccc">अगर role सही है, तो Supabase में Astrologer Panel V2 SQL एक बार run करें।</p><button class="btn primary" onclick="location.reload()">Retry</button><button class="btn secondary" onclick="location.href='/astrologer-login.html'">Astrologer Login</button></div>';
  }
}
function renderHome(){const p=state.profile||{},a=state.astrologer||{},r=state.rating||{};const photo=a.avatar_url||p.avatar_url||'';$('#homeContent').innerHTML=`
<section class="hero"><div><h1>${esc(p.full_name||'Astrologer')}</h1><p>${esc(p.email||'')}</p><p>Your Id: ${esc(String(p.short_id||p.id||'').slice(0,8))}</p></div>${photo?`<img class="avatar" src="${esc(photo)}">`:'<div class="avatar" style="display:grid;place-items:center;font-size:45px">🔮</div>'}</section>
<section class="stats"><div class="stat"><div class="icon">🪙</div><b>${money(state.todayEarning)}</b><span>Today's Earning</span></div><div class="stat"><div class="icon">👥</div><b>${esc(state.followers||0)}</b><span>Followers</span></div><button class="stat" onclick="shareProfile()"><div class="icon">🔗</div><b>Share</b><span>Share Profile</span></button></section>
<section class="card"><div class="row"><div class="rowleft"><span class="ico blue">☎</span>Call</div>${sw('call',a.call_enabled)}</div><div class="row"><div class="rowleft"><span class="ico green">💬</span>Chat</div>${sw('chat',a.chat_enabled)}</div><div class="row"><div class="rowleft"><span class="ico pink">▣</span>Video Call</div>${sw('video',a.video_enabled)}</div></section>
<section class="card"><div class="row"><div class="rowleft"><span class="ico green">🚀</span>Boost My Profile</div>${sw('boost',a.boost_enabled)}</div></section>
<section class="card">${homeLink('🎟️','Get Birth Details','birth')} ${homeLink('₹','Set Rate','rate')} ${homeLink('🔴','Go Live', 'live')} ${homeLink('👤','Profile & Expertise','profile')} ${homeLink('💬','Chat Requests','requests')} ${homeLink('👥','My Users','users')} ${homeLink('⭐','Ratings & Reviews','reviews')}</section>`}
function sw(key,on){return `<button class="switch ${on?'on':''}" onclick="toggle('${key}',${!on})"><i></i></button>`}
function homeLink(icon,title,action){return `<button class="row linkrow" style="width:100%;background:none;border:0;color:#fff" onclick="openAction('${action}')"><span class="rowleft"><span class="ico ${action==='live'?'red':action==='rate'?'blue':'yellow'}">${icon}</span>${title}</span><span class="arrow">›</span></button>`}
async function toggle(key,value){try{await api('astrologer-panel',{method:'POST',body:JSON.stringify({action:'toggle',key,value})});state.astrologer[key+'_enabled']=value;renderHome();toast('Updated successfully')}catch(e){toast(e.message)}}
function shareProfile(){const id=state.astrologer?.id||state.profile?.id;const url=location.origin+'/astrologers.html?id='+encodeURIComponent(id||'');if(navigator.share)navigator.share({title:'Study Mantra Astrologer',text:'Consult this astrologer on Study Mantra',url});else navigator.clipboard?.writeText(url).then(()=>toast('Profile link copied'))}
async function loadEarnings(){try{const d=await api('astrologer-panel?view=earnings');state.earnings=d;$('#earnContent').innerHTML=`<div class="card earnCard"><div class="moneyRow"><div class="label">My Total Earnings<small>This Month</small></div><div class="pill pblue">${money(d.total)}</div></div><div class="moneyRow"><div class="label">My Varta Earnings<small>This Month</small></div><div class="pill pgreen">${money(d.varta)}</div></div></div><div class="card earnCard"><div class="moneyRow"><div class="label">Total Affiliate Earnings<small>This Month</small></div><div class="pill ppurple">${money(d.affiliate)}</div></div><div class="moneyRow"><div class="label">Reports Affiliate Earnings<small>This Month</small></div><div class="pill ppink">${money(d.reportAffiliate)}</div></div></div><div class="card earnCard"><div class="moneyRow"><div class="label">My Service Earnings<small>This Month</small></div><div class="pill p yellow">${money(d.service)}</div></div></div><div class="card">${homeLink('🧾','Varta Earnings','varta')} ${homeLink('📊','Payment Report','payments')}</div>`}catch(e){$('#earnContent').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
async function loadPerformance(){try{const d=await api('astrologer-panel?view=performance');const rows=[['Call Ratings',d.callRating,'na'],['Chat Ratings',d.chatRating,'na'],['Chat Quality',d.chatQuality,'excellent'],['Live Hours',d.liveHours,'poor'],['Call Pickup Rate',d.callPickup,'poor'],['Chat Pickup Rate',d.chatPickup,'poor'],['Conversion Rate',d.conversion,'poor'],['Chat Response Time',d.responseTime+' sec','average'],['Login Time',d.loginHours+' hrs / day','excellent']];$('#perfContent').innerHTML=`<div class="subhead">Performance <span style="float:right;font-size:15px;color:#ddd">(Last 30 Days)</span></div><div class="card" style="padding:0;overflow:hidden"><table class="perfTable"><tr><th>Indicator</th><th>Score</th><th>Rating</th></tr>${rows.map(x=>`<tr><td>${x[0]}</td><td><span class="score ${x[2]}">${esc(x[1])}</span></td><td>${x[2]==='excellent'?'🟢 Excellent':x[2]==='average'?'🟡 Average':x[2]==='poor'?'🔴 Poor':'NA'} <span class="info">ⓘ</span></td></tr>`).join('')}</table></div><div class="card"><h2>Performance impacts income</h2><p>Performance metrics are calculated from actual calls, chats, availability and response activity stored for your account.</p></div><div class="subhead influence">Influence <span style="float:right;font-size:15px;color:#ddd">(Lifetime)</span></div><div class="card" style="padding:0;overflow:hidden"><table class="perfTable"><tr><th>Indicator</th><th>Value</th></tr><tr><td>Visible Ratings</td><td><span class="score excellent">${esc(d.visibleRating)}</span></td></tr><tr><td>Followers</td><td><span class="score excellent">${esc(d.followers)}</span></td></tr><tr><td>Reviews</td><td><span class="score excellent">${esc(d.reviews)}</span></td></tr><tr><td>Policy Violations</td><td><span class="score ${Number(d.violations)>0?'poor':'excellent'}">${esc(d.violations)}</span></td></tr></table></div>`}catch(e){$('#perfContent').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}
function renderMore(){if($('#moreContent').innerHTML)return;$('#moreContent').innerHTML=`<div class="moreSection"><h3>Settings</h3><div class="group">${moreRow('👤','Update Profile','profile','blue')}${moreRow('🌐','App Language','language','pink')}${moreRow('☀','Change Theme','theme','blue')}${moreRow('⚙','Account Management','account','orange')}</div><h3>General</h3><div class="group">${moreRow('✂','Shortcuts','shortcuts','green')}${moreRow('📰','Articles','articles','blue')}${moreRow('★','Ratings & Reviews','reviews','green')}${moreRow('✍','Feedback to CEO','feedback','blue')}${moreRow('◉','Apply Leave','leave','pink')}</div><h3>Support</h3><div class="group">${moreRow('🎧','Raise Support Ticket','ticket','blue')}${moreRow('💬','Chat Support','supportchat','green')}${moreRow('▣','Tutorials Videos','tutorials','pink')}${moreRow('☎','Call Support','callsupport','purple')}</div><p style="text-align:center;color:#ddd">Study Mantra Astrologer Panel<br>Version: 1.0</p></div>`}
function moreRow(icon,title,action,color){return `<button class="row" style="width:100%;background:none;border:0;color:#fff" onclick="openAction('${action}')"><span class="rowleft"><span class="ico ${color}">${icon}</span>${title}</span><span class="arrow">›</span></button>`}
function openAction(a){if(a==='profile'){modal(`<h2>Update Profile</h2><div class="field"><label>Bio</label><textarea id="bio" rows="4">${esc(state.astrologer?.bio||'')}</textarea></div><div class="field"><label>Experience (years)</label><input id="exp" type="number" value="${esc(state.astrologer?.experience_years||0)}"></div><div class="field"><label>Expertise</label><input id="expertise" value="${esc((state.astrologer?.expertise||[]).join(', '))}"></div><div class="field"><label>Languages</label><input id="languages" value="${esc((state.astrologer?.languages||[]).join(', '))}"></div><div class="actions"><button class="btn primary" onclick="saveProfile()">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);return}
if(a==='rate'){modal(`<h2>Set Rate</h2><div class="field"><label>Chat/Consultation Fee (₹)</label><input id="fee" type="number" min="0" value="${esc(state.astrologer?.fee||0)}"></div><div class="field"><label>Discount (%)</label><input id="discount" type="number" min="0" max="100" value="${esc(state.astrologer?.discount||0)}"></div><div class="actions"><button class="btn primary" onclick="saveRate()">Save Rate</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);return}
if(a==='requests'){loadRequests();return}if(a==='users'){loadUsers();return}if(a==='reviews'){loadReviews();return}if(a==='leave'){modal(`<h2>Apply Leave</h2><div class="field"><label>From</label><input id="lf" type="date"></div><div class="field"><label>To</label><input id="lt" type="date"></div><div class="field"><label>Reason</label><textarea id="lr"></textarea></div><div class="actions"><button class="btn primary" onclick="submitLeave()">Submit</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);return}if(a==='ticket'){modal(`<h2>Raise Support Ticket</h2><div class="field"><label>Subject</label><input id="ts"></div><div class="field"><label>Message</label><textarea id="tm" rows="5"></textarea></div><button class="btn primary" onclick="submitTicket()">Create Ticket</button>`);return}if(a==='language'){modal(`<h2>App Language</h2><div class="field"><select id="lang"><option>English</option><option>हिन्दी</option><option>Hinglish</option></select></div><button class="btn primary" onclick="toast('Language preference saved locally');closeModal()">Save</button>`);return}if(a==='theme'){modal(`<h2>Change Theme</h2><p>Dark theme is currently active.</p><button class="btn primary" onclick="document.body.style.background='#111';closeModal()">Dark Theme</button>`);return}if(a==='account'){modal(`<h2>Account Management</h2><p>Account email: ${esc(state.profile?.email||'')}</p><p>Use the main Login page for password reset and session logout.</p><button class="btn danger" onclick="localStorage.removeItem('studyMantraToken');location.href='/auth.html'">Logout</button>`);return}if(['articles','tutorials','supportchat','callsupport','feedback','shortcuts','birth','varta','payments','live'].includes(a)){modal(`<h2>${esc(a==='live'?'Go Live':a[0].toUpperCase()+a.slice(1))}</h2><p>This section is connected to the Astrologer Panel. ${a==='live'?'Use the Live toggle on Home to control your availability.':'Additional content/actions can be managed here as your Study Mantra services are enabled.'}</p><button class="btn primary" onclick="closeModal()">Close</button>`);return}}
async function saveRate(){try{await api('astrologer-profile',{method:'PATCH',body:JSON.stringify({fee:Number($('#fee').value),discount:Number($('#discount').value)})});state.astrologer.fee=Number($('#fee').value);state.astrologer.discount=Number($('#discount').value);closeModal();renderHome();toast('Rate updated')}catch(e){toast(e.message)}}
async function saveProfile(){try{await api('astrologer-profile',{method:'PATCH',body:JSON.stringify({bio:$('#bio').value,experience_years:Number($('#exp').value),expertise:$('#expertise').value.split(',').map(x=>x.trim()).filter(Boolean),languages:$('#languages').value.split(',').map(x=>x.trim()).filter(Boolean)})});closeModal();toast('Profile updated');load()}catch(e){toast(e.message)}}
async function loadRequests(){try{const d=await api('astrologer-requests');modal('<h2>Chat Requests</h2>'+(d.requests.length?d.requests.map(c=>`<div class="card" style="margin:10px 0"><b>${esc(c.profiles?.full_name||'User')}</b><p>Status: ${esc(c.status)}</p><button class="btn primary" onclick="reqStatus('${c.id}','accepted')">Accept</button> <button class="btn danger" onclick="reqStatus('${c.id}','rejected')">Reject</button></div>`).join(''):'<p>No chat requests.</p>')+'<button class="btn secondary" onclick="closeModal()">Close</button>')}catch(e){toast(e.message)}}
async function reqStatus(id,status){try{await api('astrologer-requests',{method:'PATCH',body:JSON.stringify({conversationId:id,status})});toast(status==='accepted'?'Request accepted':'Request rejected');loadRequests()}catch(e){toast(e.message)}}
async function loadUsers(){try{const d=await api('astrologer-users');modal('<h2>My Users</h2>'+(d.users.length?d.users.map(u=>`<div class="row"><span>${esc(u.full_name||'User')}<small style="display:block;color:#aaa">${esc(u.phone||'')}</small></span></div>`).join(''):'<p>No connected users yet.</p>')+'<button class="btn secondary" onclick="closeModal()">Close</button>')}catch(e){toast(e.message)}}
async function loadReviews(){try{const d=await api('reviews');modal('<h2>Ratings & Reviews</h2>'+(d.reviews.length?d.reviews.map(r=>`<div class="card" style="margin:10px 0"><b>⭐ ${esc(r.rating)}/5</b><p>${esc(r.review||'No written review')}</p></div>`).join(''):'<p>No reviews yet.</p>')+'<button class="btn secondary" onclick="closeModal()">Close</button>')}catch(e){toast(e.message)}}
async function submitLeave(){try{await api('astrologer-panel',{method:'POST',body:JSON.stringify({action:'leave',from:$('#lf').value,to:$('#lt').value,reason:$('#lr').value})});closeModal();toast('Leave request submitted')}catch(e){toast(e.message)}}
async function submitTicket(){try{await api('astrologer-panel',{method:'POST',body:JSON.stringify({action:'ticket',subject:$('#ts').value,message:$('#tm').value})});closeModal();toast('Support ticket created')}catch(e){toast(e.message)}}
function help(){modal('<h2>Astrologer Help</h2><p>Use Home to control availability, rate and consultation services. Earnings and Performance show your actual recorded activity. More contains profile, reviews, leave and support.</p><button class="btn primary" onclick="closeModal()">Close</button>')};function notifyMe(){toast('Notifications will appear here when enabled')} 
load();
</script></body></html>

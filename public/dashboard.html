<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Mantra — Dashboard</title><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{background:#10131a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;box-sizing:border-box}aside h2{margin:0 0 8px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#fff;border:0;padding:11px;border-radius:9px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#273142}main{padding:18px;max-width:1250px;width:100%;box-sizing:border-box}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:14px;padding:16px;box-shadow:0 4px 18px #0000000a}.muted{color:#667085;font-size:13px}.btn{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;background:#e8ecf5}.primary{background:#111827;color:#fff}.gold{background:#d8a700;color:#111}.danger{background:#fee2e2}.ok{background:#dcfce7}.field{margin:10px 0}.field label{display:block;font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d9dee8;border-radius:9px}.field textarea{min-height:90px;resize:vertical}.chat{display:grid;grid-template-columns:280px 1fr;gap:12px}.list{max-height:560px;overflow:auto}.conv{padding:11px;border-bottom:1px solid #eee;cursor:pointer}.conv.active{background:#eef2ff}.messages{height:430px;overflow:auto;border:1px solid #eee;border-radius:10px;padding:10px;background:#fafafa}.msg{padding:8px 10px;margin:6px 0;border-radius:10px;background:#fff;max-width:80%;white-space:pre-wrap}.mine{margin-left:auto;background:#e9efff}.composer{display:flex;gap:8px;margin-top:8px}.composer input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.hidden{display:none!important}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.chat{grid-template-columns:1fr}.messages{height:48vh}.table{display:block;overflow:auto}}
</style></head><body>
<div class="app"><aside><h2>☀ Study Mantra</h2><div id="identity" class="muted" style="color:#cbd5e1;margin-bottom:12px"></div><div id="roleBadge" class="badge"></div><div class="nav" id="nav" style="margin-top:12px"></div><button class="btn danger" id="logout" style="width:100%;margin-top:12px">Logout</button></aside>
<main><div class="top"><h1 id="title">Dashboard</h1><span id="status" class="muted"></span></div><div id="content"></div></main></div>
<script>
const $=s=>document.querySelector(s);let me=null,activeConv=null,channel=null;
async function api(url,opts={}){opts.headers={...(opts.headers||{}),...(localStorage.getItem('studyMantraToken')?{Authorization:'Bearer '+localStorage.getItem('studyMantraToken')}:{})};const r=await fetch(url,opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function navFor(role){let n=[['home','Overview']];if(role==='user')n.push(['kundli','My Kundlis'],['astrologers','Astrologers'],['chat','Live Chat'],['apply','Astrologer बनें']);if(role==='astrologer')n.push(['profile','Astrologer Profile'],['requests','Chat Requests'],['users','My Users / Kundlis'],['chat','Live Chat'],['reviews','Reviews']);if(role==='admin')n.push(['approvals','Astrologer Approval'],['users','Users'],['chat','Chat Monitor'],['reviews','Reviews']);$('#nav').innerHTML=n.map(x=>`<button data-page="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.page))}
function setTitle(x){$('#title').textContent=x;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===x))}
async function show(page){setTitle(page);const c=$('#content');try{if(page==='home')home(c);else if(page==='kundli')await kundli(c);else if(page==='astrologers')await astrologers(c);else if(page==='apply')await apply(c);else if(page==='profile')await profilePage(c);else if(page==='requests')await requests(c);else if(page==='users')await users(c);else if(page==='chat')await chatPage(c);else if(page==='approvals')await approvals(c);else if(page==='reviews')reviews(c)}catch(e){c.innerHTML=card('Error',`<p>${esc(e.message)}</p>`)}}
function home(c){const r=me.user.role;c.innerHTML=`<div class="cards">${card('Account',`<b>${esc(me.user.name||me.user.email)}</b><div class="muted">${esc(me.user.email||'')}</div>`)}${card('Role',`<span class="badge">${esc(r)}</span>`)}${r==='astrologer'?card('Astrologer status',`Profile, fee, discount, online status, requests and realtime chat are available.<p style="margin-top:12px"><a class="btn gold" href="/astrologer-dashboard.html">Open Astrologer Panel</a></p>`):card('Kundli','Create and view your Kundli from the dashboard.')}</div>`}
async function kundli(c){let x=await api('/api/my-kundlis');const rows=(x.kundlis||[]).map(k=>`<div class="card"><b>${esc(k.name)}</b><div class="muted">${esc(k.dob)} · ${esc(k.place)}</div><a href="/kundli.html" class="btn">Open Kundli</a></div>`).join('');c.innerHTML=`<div class="cards">${rows||card('No Kundli','Create one from the Kundli form.')}</div><p><a href="/kundli-form.html" class="btn primary">🪐 New Free Kundli</a></p>`}
async function astrologers(c){let x=await api('/api/astrologers');const rows=(x.astrologers||[]).map(a=>`<div class="card"><b>${esc(a.full_name||a.name||'Astrologer')}</b><div class="muted">₹${esc(a.fee)} · Discount ${esc(a.discount)}% · ${a.online?'🟢 Online':'⚪ Offline'}</div><button class="btn gold" onclick="requestChat('${a.id}')">Request Chat</button></div>`).join('');c.innerHTML=`<div class="cards">${rows||card('No verified astrologers','Approved astrologers will appear here.')}</div>`}
async function requestChat(id){try{await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({astrologerId:id})});alert('Chat request sent.');show('chat')}catch(e){alert(e.message)}}
async function apply(c){let x=await api('/api/astrologer-apply');if(x.application){c.innerHTML=card('Astrologer application',`<span class="badge">${esc(x.application.status)}</span><p>${esc(x.application.admin_note||'Admin review pending.')}</p>`);return}c.innerHTML=`<div class="card"><h3>Astrologer account आवेदन</h3><p class="muted">पहले application submit होगा। Admin approval के बाद आपका account Astrologer role में बदल जाएगा और dashboard unlock होगा।</p><div class="field"><label>Experience (years)</label><input id="ex" type="number" min="0" value="0"></div><div class="field"><label>Expertise (comma separated)</label><input id="xp" placeholder="Vedic, Kundli, Matching"></div><div class="field"><label>Languages (comma separated)</label><input id="lang" placeholder="Hindi, English"></div><div class="field"><label>Starting fee</label><input id="fee" type="number" min="0" value="0"></div><div class="field"><label>Bio</label><textarea id="bio" placeholder="अपने अनुभव और सेवाओं के बारे में"></textarea></div><button class="btn gold" onclick="submitApply()">Submit Application</button></div>`}
async function submitApply(){try{await api('/api/astrologer-apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({experience_years:+$('#ex').value,expertise:$('#xp').value.split(',').map(x=>x.trim()).filter(Boolean),languages:$('#lang').value.split(',').map(x=>x.trim()).filter(Boolean),requested_fee:+$('#fee').value,bio:$('#bio').value})});alert('Application submitted. Admin approval required.');show('home')}catch(e){alert(e.message)}}
async function profilePage(c){let x=await api('/api/astrologer-profile');let a=x.astrologer||{};c.innerHTML=`<div class="card"><h3>Astrologer Profile</h3><div class="row"><span class="badge">${a.verified?'Verified':'Pending verification'}</span><span class="badge">${a.online?'🟢 Online':'⚪ Offline'}</span></div><div class="field"><label>Bio</label><textarea id="abio">${esc(a.bio)}</textarea></div><div class="field"><label>Experience years</label><input id="aexp" type="number" min="0" value="${esc(a.experience_years||0)}"></div><div class="field"><label>Expertise</label><input id="aexpert" value="${esc((a.expertise||[]).join(', '))}"></div><div class="field"><label>Languages</label><input id="alang" value="${esc((a.languages||[]).join(', '))}"></div><div class="field"><label>Chat fee</label><input id="afee" type="number" min="0" value="${esc(a.fee||0)}"></div><div class="field"><label>Discount %</label><input id="adis" type="number" min="0" max="100" value="${esc(a.discount||0)}"></div><button class="btn gold" onclick="saveAstroProfile()">Save Profile</button><button class="btn" onclick="toggleOnline(${!a.online})">${a.online?'Go Offline':'Go Online'}</button></div>`}
async function saveAstroProfile(){try{await api('/api/astrologer-profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({bio:$('#abio').value,experience_years:+$('#aexp').value,expertise:$('#aexpert').value.split(',').map(x=>x.trim()).filter(Boolean),languages:$('#alang').value.split(',').map(x=>x.trim()).filter(Boolean),fee:+$('#afee').value,discount:+$('#adis').value})});alert('Profile saved');show('profile')}catch(e){alert(e.message)}}
async function toggleOnline(v){try{await api('/api/astrologer-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({online:v})});show('profile')}catch(e){alert(e.message)}}
async function requests(c){let x=await api('/api/astrologer-requests');const rows=(x.requests||[]).map(r=>`<tr><td>${esc(r.profiles?.full_name||r.user_id)}</td><td>${esc(r.profiles?.phone||'')}</td><td><span class="badge">${esc(r.status)}</span></td><td>${r.status==='requested'?`<button class="btn ok" onclick="setReq('${r.id}','accepted')">Accept</button> <button class="btn danger" onclick="setReq('${r.id}','rejected')">Reject</button>`:r.status==='accepted'?`<button class="btn" onclick="openConv('${r.id}')">Open Chat</button> <button class="btn" onclick="setReq('${r.id}','closed')">Close</button>`:''}</td></tr>`).join('');c.innerHTML=card('Chat Requests',`<div style="overflow:auto"><table class="table"><tr><th>User</th><th>Phone</th><th>Status</th><th>Action</th></tr>${rows||'<tr><td colspan="4">No requests.</td></tr>'}</table></div>`)}
async function setReq(id,status){try{await api('/api/astrologer-requests',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:id,status})});show('requests')}catch(e){alert(e.message)}}
async function users(c){let x=await api('/api/astrologer-users');const rows=(x.users||[]).map(u=>`<tr><td>${esc(u.full_name||'User')}</td><td>${esc(u.phone||'')}</td><td>${esc(u.created_at||'')}</td></tr>`).join('');c.innerHTML=card('My Users / Kundlis',`<p class="muted">यहाँ केवल उन users की जानकारी आती है जिनसे accepted/closed chat relation है। User की Kundli तभी पढ़ी जा सकती है जब conversation accepted हो।</p><div style="overflow:auto"><table class="table"><tr><th>Name</th><th>Phone</th><th>Joined</th></tr>${rows||'<tr><td colspan="3">No connected users.</td></tr>'}</table></div>`)}
async function chatPage(c){let x=await api('/api/chat');const list=(x.conversations||[]).map(v=>`<div class="conv" data-id="${v.id}" onclick="openConv('${v.id}')"><b>${esc(v.user_id===me.user.id?'Astrologer':'User')}</b><div class="muted">${esc(v.status)} · ${esc(v.created_at)}</div></div>`).join('');c.innerHTML=`<div class="chat"><div class="card list">${list||'No conversations yet.'}</div><div class="card"><div id="messages" class="messages">Select a conversation.</div><div class="composer"><input id="message" placeholder="Type a message…"><button class="btn primary" onclick="sendMsg()">Send</button></div></div></div>`}
async function openConv(id){activeConv=id;document.querySelectorAll('.conv').forEach(v=>v.classList.toggle('active',v.dataset.id===id));let x=await api('/api/chat?conversation_id='+encodeURIComponent(id));const box=$('#messages');if(!box)return;box.innerHTML=(x.messages||[]).map(m=>`<div class="msg ${m.sender_id===me.user.id?'mine':''}">${esc(m.body)}</div>`).join('')||'No messages yet.';box.scrollTop=box.scrollHeight;if(channel)try{channel.unsubscribe()}catch(e){}const sb=await window.SM_SUPABASE.init();if(sb){channel=sb.channel('conversation-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+id},payload=>{const m=payload.new;if(m.sender_id===me.user.id)return;box.insertAdjacentHTML('beforeend',`<div class="msg">${esc(m.body)}</div>`);box.scrollTop=box.scrollHeight}).subscribe()}}
async function sendMsg(){const input=$('#message');if(!activeConv||!input.value.trim())return;try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId:activeConv,body:input.value.trim()})});input.value='';await openConv(activeConv)}catch(e){alert(e.message)}}
async function approvals(c){let x=await api('/api/admin-astrologer');const rows=(x.applications||[]).map(a=>`<tr><td>${esc(a.profile?.full_name||a.user_id)}</td><td>${esc(a.profile?.email||'')}</td><td>${esc(a.profile?.phone||'')}</td><td>${esc(a.experience_years)}</td><td><span class="badge">${esc(a.status)}</span></td><td>${a.status==='pending'?`<button class="btn ok" onclick="approve('${a.user_id}','approved')">Approve</button> <button class="btn danger" onclick="approve('${a.user_id}','rejected')">Reject</button>`:''}</td></tr>`).join('');c.innerHTML=card('Astrologer Applications',`<div style="overflow:auto"><table class="table"><tr><th>Name</th><th>Email</th><th>Phone</th><th>Exp.</th><th>Status</th><th>Action</th></tr>${rows||'<tr><td colspan="6">No applications.</td></tr>'}</table></div>`)}
async function approve(id,status){try{await api('/api/admin-astrologer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,status})});alert(status==='approved'?'Astrologer approved.':'Application rejected.');show('approvals')}catch(e){alert(e.message)}}
function reviews(c){c.innerHTML=card('Reviews','Reviews are stored per conversation. A review UI can be opened after a chat is closed.')}
$('#logout').onclick=async()=>{try{const sb=await window.SM_SUPABASE.init();if(sb)await sb.auth.signOut()}catch(e){}localStorage.removeItem('studyMantraToken');location.href='/auth.html'};
(async()=>{try{const x=await api('/api/me');me=x;if(!me.user)throw Error('Login required');$('#identity').textContent=(me.user.name||me.user.email)+' · '+me.user.email;$('#roleBadge').textContent=me.user.role;navFor(me.user.role);show('home')}catch(e){$('#content').innerHTML=card('Login required',`<p>${esc(e.message)}</p><a class="btn primary" href="/auth.html">Login / Sign Up</a>`)}})();
</script></body></html>

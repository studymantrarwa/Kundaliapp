<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Study Mantra — Admin Control Center</title><style>
:root{--gold:#d6a400;--bg:#f5f7fb;--ink:#111827;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#090b10;color:#fff;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:21px}.gold{color:#ffd34d}.muted{color:#6b7280;font-size:13px}.nav{margin-top:20px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#d7dce5;padding:11px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#252b36;color:#fff}.logout{margin-top:15px;width:100%;padding:10px;border:0;border-radius:10px;background:#3a171a;color:#ffcaca}.main{padding:20px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 4px 18px #0000000a}.num{font-size:28px;font-weight:900;margin-top:4px}.btn{border:0;border-radius:9px;padding:8px 11px;cursor:pointer;background:#e9edf4;font-weight:750}.btn.gold{background:var(--gold);color:#111}.btn.danger{background:#fee2e2;color:#991b1b}.btn.ok{background:#dcfce7;color:#166534}.btn.dark{background:#111827;color:#fff}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{padding:9px;border:1px solid #ddd;border-radius:9px;min-width:210px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap}.note{padding:11px;background:#fff7d6;border:1px solid #f3d675;border-radius:10px;color:#6b4f00}.oktxt{color:#166534}.err{color:#991b1b}@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.main{padding:12px}}
</style></head><body><div class="app"><aside><div class="brand">☀ Study <span class="gold">Mantra Admin</span></div><div id="identity" class="muted" style="color:#aeb7c5;margin-top:6px"></div><div class="nav" id="nav"></div><button class="logout" onclick="logout()">Logout</button></aside><main class="main"><div class="top"><div><h1 id="title" style="margin:0">Admin Control Center</h1><div id="status" class="muted">Admin-only protected</div></div><a class="btn" href="/">Home</a></div><div id="content" style="margin-top:16px"></div></main></div>
<script>
const $=s=>document.querySelector(s);let page='overview',stats=null;const token=()=>localStorage.getItem('studyMantraToken');
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token()};const r=await fetch(url,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const nav=[['overview','Overview'],['applications','Astrologer Approval'],['astrologers','Astrologers & Ranking'],['users','Users / Block'],['payments','Payment Approval'],['chats','Chat Monitor'],['reviews','Review Moderation'],['audit','Audit Log']];$('#nav').innerHTML=nav.map(x=>`<button data-p="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.p));
function title(){const x=nav.find(n=>n[0]===page);$('#title').textContent=x?x[1]:'Admin'}
function card(t,b){return `<div class="card"><h3 style="margin-top:0">${t}</h3>${b}</div>`}
async function show(p){page=p;title();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));try{if(p==='overview')await overview();else if(p==='applications')await applications();else if(p==='astrologers')await astrologers();else if(p==='users')await users();else if(p==='payments')await payments();else if(p==='chats')await chats();else if(p==='reviews')await reviews();else if(p==='audit')await audit()}catch(e){$('#content').innerHTML=card('Error',`<p class="err">${esc(e.message)}</p>`)}}
async function overview(){const x=await api('/api/admin?action=overview');stats=x.stats;$('#content').innerHTML=`<div class="cards">${Object.entries(stats).map(([k,v])=>`<div class="card"><div class="muted">${esc(k.replace(/([A-Z])/g,' $1'))}</div><div class="num">${typeof v==='number'&&k==='revenue'?'₹'+v:v}</div></div>`).join('')}</div><div class="cards" style="margin-top:12px">${card('Quick Actions','<button class="btn gold" onclick="show(\'applications\')">Review Astrologer Applications</button> <button class="btn" onclick="show(\'payments\')">Payment Approval</button> <button class="btn" onclick="show(\'users\')">Block User</button>')}${card('Chat Rule','<p>Astrologer accept: <b>2 minutes</b>. After accept, user confirm: <b>2 minutes</b>. Expired requests automatically become missed.</p>')}${card('Ranking','<p>Score uses rating, completed chats, acceptance, response speed and reliability. Recalculate from Astrologers & Ranking.</p>')}</div>`}
async function applications(){const x=await api('/api/admin?action=applications');const rows=(x.applications||[]).map(a=>`<tr><td>${a.avatar_url?`<img src="${esc(a.avatar_url)}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px">`:''}${esc(a.profile?.full_name||'')}</td><td>${esc(a.profile?.email||'')}</td><td>${esc(a.status)}</td><td>${esc(a.education||'')}</td><td>${esc(a.experience_years||0)}</td><td>${esc((a.expertise||[]).join(', '))}</td><td>${a.status==='pending'?`<button class="btn ok" onclick="appAction('${a.user_id}','approved')">Approve</button> <button class="btn danger" onclick="appAction('${a.user_id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('');$('#content').innerHTML=card('Astrologer Approval',`<div class="note">Approve करने पर profile role = astrologer और verified astrologer record बनता है।</div><div class="table-wrap" style="margin-top:12px"><table class="table"><tr><th>Astrologer</th><th>Email</th><th>Status</th><th>Education</th><th>Exp.</th><th>Expertise</th><th>Action</th></tr>${rows}</table></div>`)}
async function appAction(id,status){try{await api('/api/admin?action=application',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,status})});alert(status==='approved'?'Astrologer approved':'Application rejected');show('applications')}catch(e){alert(e.message)}}
async function astrologers(){const x=await api('/api/admin?action=astrologers');const rows=(x.astrologers||[]).map(a=>`<tr><td>#${esc(a.rank_position||'-')}</td><td>${esc(a.full_name||'')}</td><td>${esc(a.rank_score)}</td><td>⭐ ${esc(a.rating_avg)}</td><td>${esc(a.completed_chats)}</td><td>${esc(a.accepted_requests)}</td><td>${esc(a.missed_requests)}</td><td>${esc(a.response_seconds_avg)}s</td><td><span class="badge">${a.online?'Online':'Offline'}</span></td><td><button class="btn" onclick="editAstro('${a.id}',${a.fee},${a.discount},${a.online})">Edit</button></td></tr>`).join('');$('#content').innerHTML=card('Astrologers & Ranking',`<button class="btn gold" onclick="recalc()">Recalculate Ranking</button><div class="table-wrap" style="margin-top:12px"><table class="table"><tr><th>Rank</th><th>Name</th><th>Score</th><th>Rating</th><th>Completed</th><th>Accepted</th><th>Missed</th><th>Avg Response</th><th>Online</th><th>Action</th></tr>${rows}</table></div>`)}
async function recalc(){try{await api('/api/admin?action=recalculate-ranks',{method:'POST'});alert('Ranking recalculated');show('astrologers')}catch(e){alert(e.message)}}
async function editAstro(id,fee,discount,online){const nf=prompt('Fee',fee);if(nf===null)return;const nd=prompt('Discount %',discount);if(nd===null)return;try{await api('/api/admin?action=astrologer',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({astrologer_id:id,fee:+nf,discount:+nd,online})});show('astrologers')}catch(e){alert(e.message)}}
async function users(){const q=prompt('Search name/email/mobile (optional)','')||'';const x=await api('/api/admin?action=users&q='+encodeURIComponent(q));const rows=(x.users||[]).map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone||'')}</td><td>${esc(u.role)}</td><td>${u.blocked?'<span class="badge">Blocked</span>':'Active'}</td><td><button class="btn ${u.blocked?'ok':'danger'}" onclick="blockUser('${u.id}',${!u.blocked})">${u.blocked?'Unblock':'Block'}</button></td></tr>`).join('');$('#content').innerHTML=card('Users / Block',`<div class="toolbar"><button class="btn" onclick="show('users')">Refresh / Search</button></div><div class="table-wrap"><table class="table"><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Status</th><th>Action</th></tr>${rows}</table></div>`)}
async function blockUser(id,v){const reason=v?(prompt('Block reason','Policy violation')||'Admin action'):'';try{await api('/api/admin?action=user',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:id,blocked:v,blocked_reason:reason})});show('users')}catch(e){alert(e.message)}}
async function payments(){const x=await api('/api/admin?action=payments');const rows=(x.payments||[]).map(p=>`<tr><td>${new Date(p.created_at).toLocaleString()}</td><td>${esc(p.user?.full_name||'')}</td><td>₹${esc(p.amount)}</td><td>${esc(p.reference||'')}</td><td>${esc(p.status)}</td><td>${p.status==='pending'?`<button class="btn ok" onclick="payAction('${p.id}','approved')">Approve</button> <button class="btn danger" onclick="payAction('${p.id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('');$('#content').innerHTML=card('Payment Approval',`<div class="note">यह module manual/UPI transaction references की admin approval संभालता है। Actual gateway integration अलग provider credentials के बिना नहीं जोड़ा गया है।</div><div class="table-wrap" style="margin-top:12px"><table class="table"><tr><th>Date</th><th>User</th><th>Amount</th><th>Reference</th><th>Status</th><th>Action</th></tr>${rows}</table></div>`)}
async function payAction(id,status){try{await api('/api/admin?action=payment',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_id:id,status})});show('payments')}catch(e){alert(e.message)}}
async function chats(){const x=await api('/api/admin?action=conversations');const rows=(x.conversations||[]).map(c=>`<tr><td>${esc(c.user?.full_name||'')}</td><td>${esc(c.astrologer?.full_name||'')}</td><td>${esc(c.status)}</td><td>${esc(c.missed_by||'')}</td><td>${new Date(c.created_at).toLocaleString()}</td><td><button class="btn" onclick="forceClose('${c.id}')">Close</button> <button class="btn dark" onclick="viewMessages('${c.id}')">Messages</button></td></tr>`).join('');$('#content').innerHTML=card('Chat Monitor',`<div class="table-wrap"><table class="table"><tr><th>User</th><th>Astrologer</th><th>Status</th><th>Missed By</th><th>Created</th><th>Action</th></tr>${rows}</table></div><div id="chatmsg" style="margin-top:12px"></div>`)}
async function forceClose(id){try{await api('/api/admin?action=conversation',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:id,status:'closed'})});show('chats')}catch(e){alert(e.message)}}
async function viewMessages(id){try{const x=await api('/api/admin?action=messages&conversation_id='+encodeURIComponent(id));$('#chatmsg').innerHTML=card('Messages',`<div style="max-height:350px;overflow:auto">${(x.messages||[]).map(m=>`<p><b>${esc(m.sender?.full_name||'')}</b>: ${esc(m.body)}</p>`).join('')||'No messages'}</div>`)}catch(e){alert(e.message)}}
async function reviews(){const x=await api('/api/admin?action=reviews');const rows=(x.reviews||[]).map(r=>`<tr><td>${esc(r.user?.full_name||'')}</td><td>${esc(r.astrologer?.full_name||'')}</td><td>⭐ ${esc(r.rating)}</td><td>${esc(r.review||'')}</td><td>${esc(r.moderation_status)}</td><td><button class="btn ok" onclick="reviewAction('${r.id}','approved')">Approve</button> <button class="btn danger" onclick="reviewAction('${r.id}','hidden')">Hide</button></td></tr>`).join('');$('#content').innerHTML=card('Review Moderation',`<div class="table-wrap"><table class="table"><tr><th>User</th><th>Astrologer</th><th>Rating</th><th>Review</th><th>Status</th><th>Action</th></tr>${rows}</table></div>`)}
async function reviewAction(id,status){try{await api('/api/admin?action=review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_id:id,moderation_status:status})});show('reviews')}catch(e){alert(e.message)}}
async function audit(){const x=await api('/api/admin?action=audit');const rows=(x.logs||[]).map(l=>`<tr><td>${new Date(l.created_at).toLocaleString()}</td><td>${esc(l.admin?.full_name||'')}</td><td>${esc(l.action)}</td><td><pre style="white-space:pre-wrap">${esc(JSON.stringify(l.details))}</pre></td></tr>`).join('');$('#content').innerHTML=card('Audit Log',`<div class="table-wrap"><table class="table"><tr><th>Date</th><th>Admin</th><th>Action</th><th>Details</th></tr>${rows}</table></div>`)}
async function logout(){localStorage.removeItem('studyMantraToken');location.href='/auth.html'}
(async()=>{try{const x=await api('/api/me');if(x.user?.role!=='admin')throw Error('Admin only');$('#identity').textContent=x.user.name||x.user.email;show('overview')}catch(e){$('#content').innerHTML=card('Access denied',`<p class="err">${esc(e.message)}</p><a class="btn gold" href="/auth.html">Admin Login</a>`)}})();
</script></body></html>

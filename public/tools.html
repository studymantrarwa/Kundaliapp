<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Mantra Astrology Tools</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><h1>Study Mantra Astrology</h1>
<div class="card"><h2>🔢 Numerology</h2><input id="n" placeholder="Name"><input id="d" type="date"><button onclick="N()">Calculate</button><pre id="no"></pre></div>
<div class="card"><h2>🔮 Daily Horoscope</h2><select id="s"><option value="1">Mesha</option><option value="2">Vrishabha</option><option value="3">Mithuna</option><option value="4">Karka</option><option value="5">Simha</option><option value="6">Kanya</option><option value="7">Tula</option><option value="8">Vrishchika</option><option value="9">Dhanu</option><option value="10">Makara</option><option value="11">Kumbha</option><option value="12">Meena</option></select><button onclick="H()">View</button><pre id="ho"></pre></div>
<div class="card"><h2>🗓️ Panchang</h2><input id="p" type="date"><button onclick="P()">View</button><pre id="po"></pre></div>
<div class="card"><h2>❤️ Kundli Matching</h2><input id="an" placeholder="Person A name"><input id="ad" type="date"><input id="bn" placeholder="Person B name"><input id="bd" type="date"><button onclick="M()">Calculate</button><pre id="mo"></pre></div>
<div class="card"><h2>💬 Chat with Astrologer</h2><p>Live Chat, chat requests, messages and saved Kundli sharing are available in the dashboard.</p><a href="/dashboard.html">Open Dashboard</a></div>
<script>
async function post(u,b){let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.json()}
async function N(){no.textContent=JSON.stringify(await post("/api/numerology",{name:n.value,dob:d.value}),null,2)}
async function H(){ho.textContent=JSON.stringify(await fetch("/api/horoscope?sign="+s.value).then(r=>r.json()),null,2)}
async function P(){po.textContent=JSON.stringify(await fetch("/api/panchang?date="+p.value).then(r=>r.json()),null,2)}
async function M(){mo.textContent=JSON.stringify(await post("/api/matching",{a:{name:an.value,dob:ad.value},b:{name:bn.value,dob:bd.value}}),null,2)}
</script></main></body></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Mantra — Admin</title></head><body style="background:#080808;color:#fff;font-family:system-ui;padding:30px;text-align:center"><h2>Study Mantra Admin</h2><p id="s">Checking admin account…</p><a href="/auth.html" style="color:#f2bd18">Login / Sign Up</a><script>(async()=>{const t=localStorage.getItem('studyMantraToken');if(!t){document.querySelector('#s').textContent='पहले Admin account से Login करें।';return}try{const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(!r.ok||j.user?.role!=='admin')throw Error('Admin access required');location.href='/admin-panel.html'}catch(e){document.querySelector('#s').textContent=e.message}})()</script></body></html>
